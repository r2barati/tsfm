[project]
name = "tsfm-prospective-cpu"
version = "0.1.0"
description = "Reproducible CPU-only prospective TSFM evaluation"
requires-python = "==3.13.*"
dependencies = [
  "chronos-forecasting",
  "granite-tsfm==0.3.9",
  "numpy",
  "pandas",
  "PyYAML",
  "requests",
  "statsforecast==2.1.1",
  "torch==2.10.0+cpu",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tsfm-prospective = "prospective_cpu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospective_cpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
